<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STALKER.GRAM PDA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #080c08;
            color: #00ff66;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 12px;
        }
        .pda-frame {
            border: 2px solid #00ff66;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 0 12px rgba(0,255,102,0.25);
        }
        .header {
            text-align: center;
            border-bottom: 1px dashed #00ff66;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .user-card {
            background: #101810;
            border: 1px solid #00aa44;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
        }
        .btn-pda {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="pda-frame">
        <div class="header">
            <strong>📟 КПК STALKER.GRAM</strong><br>
            <small>СЕТЬ: АКТИВНА</small>
        </div>

        <div class="user-card">
            <p>👤 <b>Позывной:</b> <span id="callsign">Сталкер</span></p>
            <p>⭐ <b>Опыт:</b> <span id="exp">0 EXP</span></p>
            <p>🪖 <b>Снаряжение:</b> Куртка новичка</p>
        </div>

        <button class="btn-pda" onclick="alert('Лента вылазок загружается...')">📡 ЛЕНТА ВЫЛАЗОК</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('callsign').innerText = tg.initDataUnsafe.user.first_name;
        }
    </script>
</body>
</html>
